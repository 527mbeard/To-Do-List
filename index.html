<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>90s To-Do List</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="https://use.typekit.net/fbh2agg.css">
    <!-- Bootstrap CSS v5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link href="style.css" rel="stylesheet" />
</head>

<body>
    <header>
        <!-- place navbar here -->
    </header>
    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                <h1 class="text-center"> 90s To-Do List</h1>
                <div class="row maintodo">
                    <div class="col-6 mt-4">
                        <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task" w-100
                            autofocus />
                    </div>
                    <div class="col-3 mt-4">
                        <button id="addTaskBtn" class="btn btnside w-100">
                            <div class="h2text">Add Task </div>
                        </button>
                    </div>
                    <div class="col-3 mt-4">
                        <button id="clearTasksBtn" class="btn btnside w-100">
                            <div class="h2text">Clear All Tasks</div>
                        </button>
                    </div>
                    <div class="col-12 mt-3">
                        <h5 id="taskCounter" class="text-center">Total Tasks: 0</h5>
                    </div>
                    <div class="col-12 mt-4 mb-4">
                        <ul id="taskList" class="list-group"></ul>
                    </div>
                </div>
            </div>
        </div>
        <button id="darkModeBtn" class="btn btnside btntoggle mt-2">
            <div class="h2text">Toggle Dark Mode</div>
        </button>
    </main>
    <footer>
        <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
